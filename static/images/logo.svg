<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="kbRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <linearGradient id="kbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon Background -->
  <rect x="10" y="12" width="76" height="76" rx="18" fill="url(#kbRedGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Gold Shield Accent -->
  <rect x="13" y="15" width="70" height="70" rx="15" fill="none" stroke="url(#kbGoldGrad)" stroke-width="1.8" opacity="0.85"/>
  
  <!-- Stylized Royal 'K' with Pillars -->
  <path d="M33 28 V72 M33 50 H47 L62 28 M45 48 L64 72" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Gold Crown / Kalasha Accent dot on K -->
  <circle cx="48" cy="28" r="3.5" fill="url(#kbGoldGrad)"/>
  <circle cx="62" cy="28" r="3.5" fill="url(#kbGoldGrad)"/>

  <!-- Brand Typography -->
  <text x="105" y="55" 
        font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
        font-size="36" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#B71C1C">KUBERA</text>

  <!-- Bank Subtext -->
  <text x="107" y="74" 
        font-family="'Inter', system-ui, sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#D4AF37">BANK</text>
        
  <!-- Subtle Tagline -->
  <text x="108" y="87" 
        font-family="'Inter', system-ui, sans-serif" 
        font-size="8.5" 
        font-style="italic" 
        letter-spacing="0.5" 
        fill="#666666">Your Wealth, Our Responsibility.</text>
</svg>
